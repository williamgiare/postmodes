[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postmodes"
version = "1.0.0"
description = "Eigenmode-based comparison of n-dimensional posterior distributions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "getdist>=1.5",
    "numpy>=1.24",
    "scipy>=1.10",
]

[tool.setuptools.packages.find]
include = ["postmodes*"]

[project.scripts]
postmodes = "postmodes.__main__:main"
